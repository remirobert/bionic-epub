[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bionic-epub"
version = "0.1.0"
description = "Convert EPUB ebooks into Bionic Reading format with accurate fixation and saccade controls"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "regex>=2024.0.0",
    "typer>=0.12.0",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
bionic-reading = "bionic_reading.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/bionic_reading"]

[tool.hatch.build]
sources = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
